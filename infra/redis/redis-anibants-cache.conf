# Redis instance for the cache.
# Everything here can be rebuilt from Postgres, so losing it is fine.

# Only reachable from this machine.
bind 127.0.0.1 -::1
protected-mode yes
port 6381

# Run under systemd (redis-server@anibants-cache).
supervised systemd
daemonize no
pidfile /run/redis-anibants-cache/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-anibants-cache.log

dir /var/lib/redis/anibants-cache

# No persistence: no snapshots and no append-only file.
save ""
appendonly no

# When the cap is reached, delete the least recently used keys to make room.
maxmemory 128mb
maxmemory-policy allkeys-lru
