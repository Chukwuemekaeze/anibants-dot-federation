# Redis instance for the Asynq job queue.
# Its one rule: never lose a job.

# Only reachable from this machine.
bind 127.0.0.1 -::1
protected-mode yes
port 6380

# Run under systemd (redis-server@anibants-jobs).
supervised systemd
daemonize no
pidfile /run/redis-anibants-jobs/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-anibants-jobs.log

# Own data folder, so it never mixes files with the cache instance.
dir /var/lib/redis/anibants-jobs

# Persistence: log every write to the append-only file and flush it to
# disk once a second, so a crash loses at most about one second of writes.
appendonly yes
appendfsync everysec
# Periodic snapshots as well, as a second copy.
save 3600 1 300 100 60 10000
dbfilename dump.rdb

# Never delete keys to free memory. When the cap is reached, Redis rejects
# new writes with an error instead of silently dropping jobs.
maxmemory 256mb
maxmemory-policy noeviction
